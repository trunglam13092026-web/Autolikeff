<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÃ XÁC MINH - TLZ BUFF LIKE</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .pass-box { font-size: 24px; font-weight: bold; color: #00ff88; background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px dashed #00ff88; letter-spacing: 2px; }
        .btn-copy { background: #0088cc; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-copy:hover { background: #006699; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 VƯỢT LINK THÀNH CÔNG</h2>
        <p>Mã xác minh của bạn là (Hiệu lực 10 phút):</p>
        
        <div class="pass-box" id="passCode">Đang tải...</div>
        
        <button class="btn-copy" onclick="copyPass()">📋 SAO CHÉP MÃ</button>
    </div>

    <script>
        // --- CHẶN TRUY CẬP TRỰC TIẾP / LƯU LINK BOOKMARK ---
        // Kiểm tra xem người dùng có đi từ trang ngoài (Link4M hoặc trang chủ của bạn) vào không
        const referrer = document.referrer;
        
        // Bạn có thể thay đổi hoặc thêm domain của Link4M vào đây nếu muốn check kỹ hơn
        // Nếu referrer trống (tức là gõ trực tiếp hoặc dán thẳng link pass.html lên trình duyệt)
        if (!referrer || (!referrer.includes("link4m") && !referrer.includes("bufflikeff.site"))) {
            alert("⚠️ Phát hiện hành vi truy cập trực tiếp không qua vượt link! Vui lòng thực hiện lại.");
            window.location.href = "getkey.html"; // Đá về trang lấy key bắt vượt lại từ đầu
        }

        function generateRandomPass() {
            const now = new Date();
            const day = now.getDate();
            const hour = now.getHours();
            const block10 = Math.floor(now.getMinutes() / 10);
            
            const seed = "TLZ-SECRET-" + day + "-" + hour + "-" + block10;
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            const hex = Math.abs(hash).toString(16).toUpperCase().padEnd(8, '0');
            return "TLZ-" + hex.slice(0, 4) + "-" + hex.slice(4, 8);
        }

        const currentPass = generateRandomPass();
        document.getElementById("passCode").innerText = currentPass;

        function copyPass() {
            navigator.clipboard.writeText(currentPass);
            alert("Đã sao chép mã xác minh: " + currentPass);
        }
    </script>
</body>
</html>
