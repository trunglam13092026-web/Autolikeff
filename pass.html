<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã Xác Minh - Buff Like Free Fire</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .pass-box { font-size: 24px; font-weight: bold; color: #d9534f; background: #ffeeba; padding: 15px; border-radius: 5px; margin: 20px 0; word-break: break-all; letter-spacing: 1px; }
        .btn { display: block; width: 100%; padding: 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 16px; background-color: #28a745; color: white; }
        .note { font-size: 13px; color: #666; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>MÃ XÁC MINH CỦA BẠN</h2>
    <p>Hãy sao chép mã dưới đây và dán vào trang lấy Key:</p>
    
    <div class="pass-box" id="passCode">Đang tải mã...</div>

    <button class="btn" onclick="copyPass()">📋 SAO CHÉP MÃ XÁC MINH</button>

    <div class="note">
        ⚠️ <b>Lưu ý:</b> Mã này thay đổi theo giờ để bảo mật. Sau khi sao chép, hãy quay lại trang lấy Key để tiếp tục.
    </div>
</div>

<script>
    function generatePass() {
        const now = new Date();
        const day = now.getDate();     
        const hour = now.getHours();   
        return "tlz-" + day + "-h" + hour;
    }

    const code = generatePass();
    document.getElementById("passCodeinnerText") ? null : document.getElementById("passCode").innerText = code;

    function copyPass() {
        navigator.clipboard.writeText(code).then(() => {
            alert("Đã sao chép mã: " + code);
        });
    }
</script>

</body>
</html>
