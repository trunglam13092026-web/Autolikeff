<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Thành Công</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 40px 15px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { color: #fff; margin-bottom: 10px; }
        p { font-size: 14px; color: #bbb; margin-bottom: 20px; }
        .key-box { background: #2a2a2a; border: 1px dashed #00ff88; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; color: #00ff88; word-break: break-all; margin-bottom: 20px; letter-spacing: 1px; }
        .btn { display: block; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; box-sizing: border-box; text-decoration: none; text-align: center; margin-bottom: 12px; }
        .btn-copy { background: #007bff; color: white; }
        .btn-copy:hover { background: #0056b3; }
        .btn-go { background: #28a745; color: white; }
        .btn-go:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h3>🎉 VƯỢT LINK THÀNH CÔNG</h3>
        <p>Key ngẫu nhiên của bạn (Hiệu lực 10 phút):</p>

        <div class="key-box" id="keyDisplay">Đang tạo Key...</div>

        <button class="btn btn-copy" onclick="copyKey()">📋 SAO CHÉP KEY</button>
        
        <a href="index.html" class="btn btn-go">🚀 Đi đến trang buff</a>
    </div>

    <script>
        const SECRET_KEY = "TLZ_PROJECT_SECRET_2026";

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }

        function generateKey() {
            const expireTime = new Date().getTime() + (10 * 60 * 1000); // Hạn 10 phút
            const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
            const rawData = expireTime + "_" + randomPart;
            const sig = simpleHash(rawData + SECRET_KEY).toUpperCase().slice(0, 4);
            const hexExpire = expireTime.toString(36).toUpperCase();

            return `TLZ-${randomPart}-${sig}-${hexExpire}`;
        }

        // Tạo mới hoàn toàn Key mỗi khi khách vượt link thành công để tránh bị kẹt cache cũ
        const newKey = generateKey();
        localStorage.setItem("current_valid_key", newKey);

        // Hiển thị Key ra màn hình ngay lập tức
        const keyDisplay = document.getElementById("keyDisplay");
        keyDisplay.innerText = newKey;

        function copyKey() {
            navigator.clipboard.writeText(newKey).then(() => {
                alert("Đã sao chép Key thành công!");
            }).catch(err => {
                // Fallback nếu trình duyệt chặn clipboard API
                alert("Không thể tự động copy, vui lòng bôi đen và copy thủ công!");
            });
        }
    </script>
</body>
</html>
