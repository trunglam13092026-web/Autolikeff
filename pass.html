    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

        // Lấy định dạng ngày tháng chuẩn theo năm-tháng-ngày để phân biệt các ngày khác nhau
        function getSystemDate() {
            const d = new Date();
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedDate = localStorage.getItem('tlz_key_date');
            const savedKey = localStorage.getItem('active_tlz_key');
            const currentDate = getSystemDate();
            
            const urlParams = new URLSearchParams(window.location.search);
            const isBypassed = urlParams.get('bypassed');

            // 1. Kiểm tra xem đã lưu Key của ngày hôm nay chưa
            if (savedDate === currentDate && savedKey) {
                // Đã có sẵn -> Hiện thẳng Key cũ, không cho phép đổi hay reset nữa
                showKeySection(savedKey);
                cleanUrl();
            } 
            // 2. Nếu vừa vượt link Link4M / Bumx về (có ?bypassed=true) -> Mở bảng Captcha
            else if (isBypassed === 'true') {
                document.getElementById('stepGetLink').classList.add('hidden');
                document.getElementById('stepCaptcha').classList.remove('hidden');
            } 
            // 3. Truy cập chay chưa qua link -> Bắt buộc vượt link
            else {
                document.getElementById('stepGetLink').classList.add('hidden');
                document.getElementById('stepCaptcha').classList.add('hidden');
                document.getElementById('stepGetLink').classList.remove('hidden'); // Hiện lại nút vượt link
                
                // Nếu trước đó đã lỡ lưu key ngày cũ thì xóa đi để làm vòng mới
                if (savedDate !== currentDate) {
                    localStorage.removeItem('active_tlz_key');
                    localStorage.removeItem('tlz_key_date');
                }
            }
        });

        // Xóa tham số ?bypassed=true trên URL để khi F5 không bị kẹt hay reset luồng
        function cleanUrl() {
            if (window.history.replaceState) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({path: cleanUrl}, '', cleanUrl);
            }
        }

        // Khi vượt qua Captcha thành công
        async function onCaptchaSuccess(token) {
            document.getElementById('stepGetLink').classList.add('hidden');
            document.getElementById('stepCaptcha').classList.add('hidden');
            document.getElementById('stepShowKey').classList.remove('hidden');

            const currentDate = getSystemDate();
            const savedDate = localStorage.getItem('tlz_key_date');
            const savedKey = localStorage.getItem('active_tlz_key');

            // Nếu lỡ bấm lại mà cùng ngày thì lấy lại key cũ đã lưu cho chắc chắn
            if (savedDate === currentDate && savedKey) {
                showKeySection(savedKey);
                cleanUrl();
                return;
            }

            // Gọi Server lấy Key mới chính thức cho ngày hôm nay
            try {
                document.getElementById("keyDisplay").innerText = "⏳ Đang tạo Key từ hệ thống...";
                const res = await fetch(GAS_API_URL + "?action=get_key");
                const data = await res.json();

                if (data.status === "success") {
                    // Lưu cứng ngày và Key vào trình duyệt
                    localStorage.setItem('tlz_key_date', currentDate);
                    localStorage.setItem('active_tlz_key', data.key);
                    
                    showKeySection(data.key);
                    cleanUrl();
                } else {
                    document.getElementById("keyDisplay").innerText = "❌ Lỗi tạo Key từ Server!";
                }
            } catch (e) {
                document.getElementById("keyDisplay").innerText = "❌ Không thể kết nối tới Server!";
            }
        }

        function showKeySection(key) {
            document.getElementById('stepGetLink').classList.add('hidden');
            document.getElementById('stepCaptcha').classList.add('hidden');
            document.getElementById('stepShowKey').classList.remove('hidden');
            document.getElementById("keyDisplay").innerText = key;
        }

        function copyKey() {
            const currentKey = document.getElementById("keyDisplay").innerText;
            if(!currentKey.startsWith("TLZ-")) return;
            
            navigator.clipboard.writeText(currentKey).then(() => {
                document.getElementById("statusMsg").innerText = "✅ Đã sao chép Key thành công!";
                setTimeout(() => { document.getElementById("statusMsg").innerText = ""; }, 3000);
            }).catch(err => {
                document.getElementById("statusMsg").innerText = "❌ Không thể tự động sao chép!";
            });
        }
    </script>
