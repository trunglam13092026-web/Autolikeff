<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Buff Like Free Fire</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-link { background-color: #ff9800; color: white; }
        .btn-key { background-color: #007bff; color: white; }
        .btn-copy { background-color: #17a2b8; color: white; margin-top: 10px; }
        .btn-home { background-color: #28a745; color: white; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; text-align: center; }
        button:disabled { background-color: #cccccc !important; }
        .key-box { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-weight: bold; font-size: 18px; color: #28a745; word-break: break-all; }
        .step-desc { font-size: 14px; color: #555; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h2>LẤY KEY MIỄN PHÍ</h2>
    
    <!-- KHỐI BƯỚC THỰC HIỆN (SẼ BỊ ẨN KHI LẤY KEY THÀNH CÔNG) -->
    <div id="actionArea">
        <div class="step-desc">
            <b>Hướng dẫn bắt buộc:</b><br>
            1. Bấm <b>"BƯỚC 1: VƯỢT LINK LẤY MÃ"</b>.<br>
            2. Vượt Captcha trên Link4M để nhận <b>Mã xác minh</b>.<br>
            3. Dán Mã xác minh vào ô dưới rồi bấm <b>"LẤY KEY NGAY"</b>.
        </div>

        <!-- LINK RÚT GỌN LINK4M -->
        <a href="https://link4m.org/SEvGWH1h" target="_blank" class="btn btn-link" id="btnStep1">👉 BƯỚC 1: VƯỢT LINK LẤY MÃ</a>

        <!-- Ô NHẬP MÃ BẮT BUỘC -->
        <input type="text" id="passInput" placeholder="Nhập mã xác minh từ Link4M...">

        <button id="btnGetKey" class="btn btn-key" onclick="generateKey()">BƯỚC 2: LẤY KEY NGAY</button>
    </div>

    <!-- KHỐI HIỂN THỊ KEY KHI LẤY THÀNH CÔNG -->
    <div id="resultBox" style="display: none;">
        <div class="key-box" id="keyDisplay">---</div>
        <button class="btn btn-copy" onclick="copyKey()">Sao Chép Key</button>
        <a href="index.html" class="btn btn-home">🚀 QUAY LẠI TRANG BUFF LIKE</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";
    
    // MÃ XÁC MINH TRÊN LINK4M
    const SECRET_PASS = "tlzproject05"; 

    function generateKey() {
        const passInput = document.getElementById("passInput").value.trim();
        const btnGetKey = document.getElementById("btnGetKey");
        const actionArea = document.getElementById("actionArea");
        const resultBox = document.getElementById("resultBox");
        const keyDisplay = document.getElementById("keyDisplay");

        if (!passInput) {
            alert("Vui lòng bấm Bước 1 vượt link để lấy Mã xác minh!");
            return;
        }

        if (passInput !== SECRET_PASS) {
            alert("Mã xác minh không chính xác! Vui lòng vượt link để lấy đúng mã.");
            return;
        }

        btnGetKey.disabled = true;
        btnGetKey.innerText = "Đang tạo Key...";

        const callbackName = "cb_getkey_" + Date.now();
        
        window[callbackName] = function(data) {
            delete window[callbackName];
            const oldScript = document.getElementById(callbackName);
            if (oldScript) oldScript.remove();

            btnGetKey.disabled = false;
            btnGetKey.innerText = "BƯỚC 2: LẤY KEY NGAY";

            if (data && data.success) {
                keyDisplay.innerText = data.key;
                
                // ẨN TOÀN BỘ NÚT BƯỚC 1 VÀ Ô NHẬP MÃ KHI THÀNH CÔNG
                actionArea.style.display = "none";
                
                // HIỆN KHUNG KẾT QUẢ KEY
                resultBox.style.display = "block";
            } else {
                alert("Lỗi: " + (data ? data.message : "Không thể lấy Key"));
            }
        };

        const script = document.getElementById(callbackName);
        if (script) script.remove();

        const newScript = document.createElement("script");
        newScript.id = callbackName;
        newScript.src = WEB_APP_URL + "?action=createKey&callback=" + callbackName;
        newScript.onerror = function() {
            delete window[callbackName];
            btnGetKey.disabled = false;
            btnGetKey.innerText = "BƯỚC 2: LẤY KEY NGAY";
            alert("Lỗi kết nối Server!");
        };

        document.body.appendChild(newScript);
    }

    function copyKey() {
        const keyText = document.getElementById("keyDisplay").innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert("Đã sao chép Key: " + keyText);
        });
    }
</script>

</body>
</html>
