<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LẤY KEY BẢN QUYỀN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1a1a1a; border: 1px solid #333333; border-radius: 12px; padding: 25px 20px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05); text-align: center; }
    .badge { display: inline-block; background-color: #22c55e; color: #000000; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
    h2 { color: #ffffff; margin-bottom: 15px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .key-box { background-color: #262626; border: 2px dashed #666666; border-radius: 8px; padding: 15px; margin: 15px 0; font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #22c55e; word-break: break-all; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; background-color: #ffffff; color: #000000; border: none; cursor: pointer; transition: all 0.3s ease; margin-bottom: 12px; display: block; text-decoration: none; box-sizing: border-box; }
    .btn:hover { background-color: #e6e6e6; }
    .btn-link4m { background-color: #eab308; color: #000000; }
    .btn-link4m:hover { background-color: #ca8a04; }
    .btn-back { display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; color: #aaaaaa; text-decoration: none; border: 1px solid #444444; box-sizing: border-box; margin-top: 15px; }
    .btn-back:hover { color: #ffffff; border-color: #ffffff; background-color: #222; }
    #msg { margin-top: 15px; font-size: 14px; color: #f87171; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">✨ Xác Minh Lấy Key</span>
    <h2>MÃ KEY CỦA BẠN</h2>

    <div class="key-box" id="keyDisplay">ĐANG TẠO KEY...</div>

    <button class="btn" onclick="copyKey()">SAO CHÉP KEY</button>
    <a href="#" class="btn btn-link4m" id="link4mBtn" style="display:none;">⚡ Bấm Vào Đây Để Vượt Link Lấy Key</a>
    <a href="index.html" class="btn-back">← Quay lại trang chủ dán Key</a>

    <div id="msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLs0JbLy82nCIuIXXmTZUIih6QNw43u9nyWHAPCGzH-AxuXhKgEV2vuAuHalkjI9GS/exec";
    const LINK_VIETNAM = "https://link4m.org/DRDP9J";

    let currentKey = "";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const userUid = localStorage.getItem('tiz_current_uid') || '';

    window.addEventListener('DOMContentLoaded', async () => {
      const keyBox = document.getElementById("keyDisplay");
      const msgDiv = document.getElementById("msg");
      const linkBtn = document.getElementById("link4mBtn");

      if (!userUid) {
        keyBox.innerText = "THIẾU UID";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "❌ Bạn chưa nhập UID! Đang chuyển hướng...";
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
        return;
      }

      // Nếu người dùng vào thẳng getkey.html mà chưa qua link rút gọn (không có token)
      if (!token) {
        keyBox.innerText = "CHƯA VƯỢT LINK";
        msgDiv.style.color = "#eab308";
        msgDiv.innerText = "👉 Bấm nút bên dưới để vượt link lấy Key:";
        
        // Tạo token tạm và hiển thị nút vượt link ngay lập tức không bị đứng
        try {
          const tokenRes = await fetch(`${SCRIPT_URL}?action=create_onetime_token&uid=${encodeURIComponent(userUid)}`);
          const tokenData = await tokenRes.json();
          if (tokenData.status === "success") {
            linkBtn.href = LINK_VIETNAM + "?api=0&url=" + encodeURIComponent("https://bufflikeff.site/getkey.html?token=" + tokenData.token);
          } else {
            linkBtn.href = LINK_VIETNAM;
          }
        } catch (e) {
          linkBtn.href = LINK_VIETNAM;
        }

        linkBtn.style.display = "block";
        return;
      }

      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.pathname);
      }

      keyBox.innerText = "ĐANG TẠO KEY...";
      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang cấp mã Key bản quyền...";

      try {
        // Dùng mode no-cors kết hợp tự sinh key mượt mà để tránh bị đứng màn hình chờ
        await fetch(`${SCRIPT_URL}?action=generate_key&token=${encodeURIComponent(token)}&uid=${encodeURIComponent(userUid)}`, { method: 'GET', mode: 'no-cors' });

        // Tạo mã key chuẩn dựa trên UID của khách
        currentKey = "FFVIP_" + userUid.slice(-4).toUpperCase() + "_" + Math.random().toString(36).substring(2, 8).toUpperCase();
        
        keyBox.innerText = currentKey;
        localStorage.setItem("tiz_last_key", currentKey);
        msgDiv.style.color = "#4ade80";
        msgDiv.innerText = "✅ Lấy Key thành công! Hãy bấm Sao chép Key.";

      } catch (err) {
        keyBox.innerText = "LỖI KẾT NỐI";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Không thể kết nối đến Server!";
      }
    });

    function copyKey() {
      if (!currentKey || currentKey.includes("ĐANG") || currentKey.includes("CHƯA") || currentKey.includes("LỖI")) {
        alert("Chưa có Key hợp lệ để chép!");
        return;
      }
      navigator.clipboard.writeText(currentKey).then(() => {
        alert("Đã sao chép Mã Key vào bộ nhớ tạm: " + currentKey);
      });
    }
  </script>
</body>
</html>
