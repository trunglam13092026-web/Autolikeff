<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LẤY KEY BẢN QUYỀN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1a1a1a; border: 1px solid #333333; border-radius: 12px; padding: 25px 20px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05); text-align: center; }
    .badge { display: inline-block; background-color: #22c55e; color: #000000; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
    h2 { color: #ffffff; margin-bottom: 15px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .key-box { background-color: #262626; border: 2px dashed #666666; border-radius: 8px; padding: 15px; margin: 15px 0; font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #22c55e; word-break: break-all; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; background-color: #ffffff; color: #000000; border: none; cursor: pointer; transition: all 0.3s ease; margin-bottom: 12px; display: block; text-decoration: none; box-sizing: border-box; }
    .btn:hover { background-color: #e6e6e6; }
    .btn-back { display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; color: #aaaaaa; text-decoration: none; border: 1px solid #444444; box-sizing: border-box; margin-top: 15px; }
    .btn-back:hover { color: #ffffff; border-color: #ffffff; background-color: #222; }
    .video-box { margin: 15px 0 5px 0; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    video { width: 100%; display: block; }
    #msg { margin-top: 15px; font-size: 14px; color: #f87171; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">✨ Thành Công</span>
    <h2>MÃ KEY CỦA BẠN</h2>

    <!-- Ô hiển thị Key -->
    <div class="key-box" id="keyDisplay">ĐANG TẠO KEY...</div>

    <!-- Nút sao chép Key -->
    <button class="btn" onclick="copyKey()">SAO CHÉP KEY</button>

    <!-- Video hướng dẫn (giữ lại để khách tham khảo nếu cần) -->
    <p style="font-size: 13px; color: #aaaaaa; text-align: left; margin-top: 20px;">🎬 Video hướng dẫn:</p>
    <div class="video-box">
      <video controls>
        <source src="lv_0_20261020044711.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ xem video.
      </video>
    </div>

    <a href="index.html" class="btn-back">← Quay lại trang chủ dán Key</a>

    <div id="msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";
    
    let currentKey = "";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const userUid = localStorage.getItem('tiz_current_uid') || '';

    window.addEventListener('DOMContentLoaded', async () => {
      const keyBox = document.getElementById("keyDisplay");
      const msgDiv = document.getElementById("msg");

      // Nếu khách chưa nhập UID ở trang chủ mà bấm mò vào đây
      if (!userUid) {
        keyBox.innerText = "LỖI TRUY CẬP";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "❌ Bạn chưa nhập UID ở trang chủ! Đang chuyển hướng về...";
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
        return;
      }

      // Nếu khách vào mà không có Token (truy cập thẳng file)
      if (!token) {
        keyBox.innerText = "THIẾU TOKEN";
        msgDiv.style.color = "#eab308";
        msgDiv.innerText = "⚠️ Bạn chưa vượt link quảng cáo! Vui lòng quay lại trang chủ thực hiện lại.";
        return;
      }

      // Xóa token trên URL để chống lộ/chia sẻ link
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.pathname);
      }

      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang xác minh và cấp Key bảo mật...";

      try {
        let userIp = "UNKNOWN_IP";
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipRes.json();
          userIp = ipData.ip || 'UNKNOWN_IP';
        } catch (e) {}

        const targetUrl = `${SCRIPT_URL}?action=generate_key&token=${encodeURIComponent(token)}&userIp=${encodeURIComponent(userIp)}&uid=${encodeURIComponent(userUid)}`;
        
        const response = await fetch(targetUrl);
        const data = await response.json();

        if (data.status === "success") {
          currentKey = data.key;
          keyBox.innerText = data.key;
          localStorage.setItem("tiz_last_key", currentKey);
          msgDiv.style.color = "#4ade80";
          msgDiv.innerText = data.message || "✅ Lấy Key thành công! Hãy bấm Sao chép Key.";
        } else {
          keyBox.innerText = "LỖI XÁC MINH";
          msgDiv.style.color = "#f87171";
          msgDiv.innerText = data.message || "Token không hợp lệ hoặc đã được sử dụng!";
        }
      } catch (err) {
        keyBox.innerText = "LỖI KẾT NỐI";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Không thể kết nối đến Server!";
      }
    });

    function copyKey() {
      if (!currentKey || currentKey.includes("ĐANG") || currentKey.includes("THIẾU") || currentKey.includes("LỖI")) {
        alert("Chưa có Key hợp lệ để chép!");
        return;
      }
      navigator.clipboard.writeText(currentKey).then(() => {
        alert("Đã sao chép Mã Key vào bộ nhớ tạm: " + currentKey);
      });
    }
  </script>
</body>
</html>
