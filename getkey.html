<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key Free Fire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #ff9900;
            margin-bottom: 20px;
        }
        .key-box {
            background-color: #2a2a2a;
            border: 2px dashed #ff9900;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            letter-spacing: 2px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
        }
        .btn {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #e68a00;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KEY FREE FIRE CỦA BẠN</h2>
    <div id="keyDisplay" class="key-box">Đang xử lý...</div>
    <button class="btn" onclick="copyKey()">Sao chép Key</button>
    <div id="status" class="status">Đang tải dữ liệu...</div>
</div>

<script>
    // Hàm lấy tham số token từ URL (?token=...)
    function getTokenFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('token');
    }

    // Hàm tạo Key ngẫu nhiên
    function generateRandomKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 8; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return `FF-OB55-${result}`;
    }

    // Hàm xử lý chính bằng LocalStorage (Lưu trực tiếp trên máy người dùng)
    function handleKey() {
        const token = getTokenFromURL();
        const keyDisplay = document.getElementById('keyDisplay');
        const statusDisplay = document.getElementById('status');

        if (!token) {
            keyDisplay.innerText = "LỖI TOKEN";
            statusDisplay.innerText = "Vui lòng vượt link rút gọn để lấy key!";
            return;
        }

        // Kiểm tra xem Token này đã có Key trong máy người dùng chưa
        let savedKey = localStorage.getItem(`ff_key_${token}`);

        if (savedKey) {
            // Đã có key -> Giữ nguyên key cũ khi F5
            keyDisplay.innerText = savedKey;
            statusDisplay.innerText = "Key của bạn (Đã lưu thành công)";
        } else {
            // Chưa có -> Tạo key mới và lưu lại vào máy
            const newKey = generateRandomKey();
            localStorage.setItem(`ff_key_${token}`, newKey);
            keyDisplay.innerText = newKey;
            statusDisplay.innerText = "Tạo key thành công!";
        }
    }

    // Hàm Sao Chép Key
    function copyKey() {
        const keyText = document.getElementById('keyDisplay').innerText;
        if (keyText.startsWith("FF-")) {
            navigator.clipboard.writeText(keyText);
            alert("Đã sao chép key thành công: " + keyText);
        } else {
            alert("Chưa có key hợp lệ để sao chép!");
        }
    }

    // Chạy hàm khi trang tải xong
    handleKey();
</script>

</body>
</html>
