<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LẤY KEY BẢN QUYỀN</title>
  <!-- Tải thư viện FingerprintJS để nhận diện phần cứng thiết bị -->
  <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 25px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #22c55e;
      color: #000000;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    h2 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .key-box {
      background-color: #262626;
      border: 2px dashed #666666;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffffff;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      background-color: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 12px;
      display: block;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #e6e6e6;
    }
    .btn-link4m {
      background-color: #eab308;
      color: #000000;
    }
    .btn-link4m:hover {
      background-color: #ca8a04;
    }
    .btn-back {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #aaaaaa;
      text-decoration: none;
      border: 1px solid #444444;
      box-sizing: border-box;
      margin-top: 15px;
    }
    .btn-back:hover {
      color: #ffffff;
      border-color: #ffffff;
      background-color: #222;
    }
    .video-box {
      margin: 15px 0 5px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    video {
      width: 100%;
      display: block;
    }
    #msg {
      margin-top: 15px;
      font-size: 14px;
      color: #f87171;
    }
    .msg-box {
      background-color: #3a1e1e;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">✨ Vượt Link Lấy Key</span>
    <h2>LẤY KEY BẢN QUYỀN</h2>

    <!-- THÔNG BÁO LỖI NẾU CHƯA VƯỢT LINK HOẶC ĐÃ BỊ KHÓA -->
    <div id="errorArea" class="msg-box" style="display: none;">
      <strong style="color: #ef4444;">❌ LỖI XÁC MINH HOẶC BẠN CHƯA VƯỢT LINK!</strong><br><br>
      Vui lòng bấm vào nút <span style="color: #eab308; font-weight: bold;">Bấm Vào Đây Để Vượt Link Lấy Key</span> màu vàng bên dưới để thực hiện đúng quy trình!
    </div>

    <!-- Ô HIỂN THỊ KEY -->
    <div class="key-box" id="keyDisplay">ĐANG TẢI...</div>

    <!-- NÚT DẪN SANG LINK4M -->
    <a href="https://link4m.org/SCAAQ" class="btn btn-link4m" id="link4mBtn">⚡ Bấm Vào Đây Để Vượt Link Lấy Key</a>

    <!-- NÚT SAO CHÉP KEY -->
    <button class="btn" onclick="copyKey()">SAO CHÉP KEY</button>

    <!-- VIDEO HƯỚNG DẪN -->
    <p style="font-size: 13px; color: #aaaaaa; text-align: left; margin-top: 20px;">🎬 Video hướng dẫn vượt link:</p>
    <div class="video-box">
      <video controls>
        <source src="lv_0_20261020044711.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ xem video.
      </video>
    </div>

    <a href="index.html" class="btn-back">← Quay lại trang chủ dán Key</a>

    <div id="msg"></div>
  </div>

  <script>
    // Link Web App Google Apps Script của bạn
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

    let currentKey = "";

    // Đọc tham số token từ URL (ví dụ: ?token=MY_SECRET_PASS_123)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    // Khởi tạo FingerprintJS để lấy vân tay phần cứng thiết bị
    let fpPromise = FingerprintJS.load();

    fpPromise.then(detector => detector.get()).then(result => {
      let deviceId = result.visitorId;

      // Gửi yêu cầu kiểm tra và lấy key sang Google Apps Script bằng phương thức POST
      return fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          deviceId: deviceId,
          token: token
        })
      });
    })
    .then(res => res.json())
    .then(data => {
      // TRƯỜNG HỢP 1: THIẾT BỊ NÀY HÔM NAY ĐÃ NHẬN KEY RỒI (ĐÃ BỊ KHÓA)
      if (data.status === "locked") {
        document.getElementById("keyDisplay").innerText = "ĐÃ KHÓA";
        document.getElementById("errorArea").style.display = "block";
        document.getElementById("errorArea").innerHTML = `<strong style="color: #ef4444;">🔒 THIẾT BỊ NÀY ĐÃ DÙNG HẾT LƯỢT HÔM NAY!</strong><br><br>${data.message}`;
        document.getElementById("msg").innerText = "";

        // Vô hiệu hóa nút Vượt Link4M
        const btnLink = document.getElementById("link4mBtn");
        if (btnLink) {
          btnLink.href = "javascript:void(0)";
          btnLink.style.backgroundColor = "#444444";
          btnLink.style.color = "#888888";
          btnLink.style.cursor = "not-allowed";
          btnLink.innerText = "🔒 ĐÃ HẾT LƯỢT HÔM NAY";
        }
        return;
      }

      // TRƯỜNG HỢP 2: CHƯA VƯỢT LINK (Sai hoặc thiếu Token)
      if (data.status === "unverified") {
        document.getElementById("errorArea").style.display = "block";
        document.getElementById("keyDisplay").innerText = "CHƯA XÁC MINH";
        document.getElementById("msg").innerText = "";
      } 
      // TRƯỜNG HỢP 3: ĐÃ VƯỢT LINK THÀNH CÔNG & ĐƯỢC CẤP KEY
      else if (data.status === "success") {
        document.getElementById("errorArea").style.display = "none";
        currentKey = data.key;
        document.getElementById("keyDisplay").innerText = data.key;
        document.getElementById("msg").style.color = "#4ade80";
        document.getElementById("msg").innerText = "✅ Lấy Key thành công! Hãy bấm Sao chép Key.";
      } 
      else {
        document.getElementById("keyDisplay").innerText = "LỖI";
        document.getElementById("msg").style.color = "#f87171";
        document.getElementById("msg").innerText = data.message || "Lỗi hệ thống!";
      }
    })
    .catch(() => {
      document.getElementById("keyDisplay").innerText = "LỖI KẾT NỐI";
      document.getElementById("msg").style.color = "#f87171";
      document.getElementById("msg").innerText = "Lỗi kết nối tới Server!";
    });

    function copyKey() {
      if (!currentKey) {
        alert("Chưa có Key để sao chép hoặc bạn chưa vượt link!");
        return;
      }
      navigator.clipboard.writeText(currentKey).then(() => {
        alert("Đã sao chép Mã Key vào bộ nhớ tạm!");
      });
    }
  </script>
</body>
</html>
