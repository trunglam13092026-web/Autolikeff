<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lấy Key Buff Like Free Fire</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    .key-box {
      margin-top: 20px;
      padding: 12px;
      background: #e9ecef;
      border: 1px dashed #6c757d;
      border-radius: 6px;
      font-weight: bold;
      font-size: 18px;
      color: #007bff;
      word-break: break-all;
    }
    .copy-btn {
      margin-top: 10px;
      background-color: #007bff;
    }
    .copy-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>LẤY KEY BUFF LIKE</h2>
    <p>Nhấn vào nút bên dưới để tạo Key mới (dùng 1 lần):</p>
    
    <button id="btnGetKey" onclick="generateKey()">LẤY KEY NGAY</button>

    <div id="resultBox" style="display: none;">
      <div class="key-box" id="keyDisplay">---</div>
      <button class="copy-btn" onclick="copyKey()">Sao Chép Key</button>
    </div>
  </div>

  <script>
    // Link Web App API đã thiết lập
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxKDUNk3jVVuV5w7jcAWYLUJreSYOi7l8dBWJKxlMqx4cwPDaSvgU0sljwa04EmLnLp/exec";

    async function generateKey() {
      const btn = document.getElementById("btnGetKey");
      const keyDisplay = document.getElementById("keyDisplay");
      const resultBox = document.getElementById("resultBox");

      btn.disabled = true;
      btn.innerText = "Đang tạo Key...";

      try {
        const response = await fetch(`${WEB_APP_URL}?action=createKey`);
        const data = await response.json();

        if (data.success) {
          keyDisplay.innerText = data.key;
          resultBox.style.display = "block";
        } else {
          alert("Lỗi: " + (data.message || "Không thể tạo Key"));
        }
      } catch (error) {
        alert("Có lỗi kết nối đến máy chủ! Vui lòng thử lại.");
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerText = "LẤY KEY NGAY";
      }
    }

    function copyKey() {
      const keyText = document.getElementById("keyDisplay").innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        alert("Đã sao chép Key thành công!");
      }).catch(() => {
        alert("Không thể tự động sao chép. Vui lòng chọn và chép thủ công.");
      });
    }
  </script>

</body>
</html>
