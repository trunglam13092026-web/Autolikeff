<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Buff Like</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; background-color: #007bff; color: white; }
        button:disabled { background-color: #cccccc; }
        .key-box { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-weight: bold; font-size: 18px; color: #28a745; word-break: break-all; }
        .copy-btn { background-color: #17a2b8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>LẤY KEY MIỄN PHÍ</h2>
    <p>Bấm nút bên dưới để tạo Key sử dụng Buff Like</p>
    
    <button id="btnGetKey" onclick="generateKey()">LẤY KEY NGAY</button>

    <div id="resultBox" style="display: none;">
        <div class="key-box" id="keyDisplay">---</div>
        <button class="copy-btn" onclick="copyKey()">Sao Chép Key</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzL9yxIq2gU_QiaOmtj1oUrscPp_fzjcYHvHcyw6Ww47SW1Rm9jX7ZM8lp_6i3l7MFz/exec";

    function generateKey() {
        const btnGetKey = document.getElementById("btnGetKey");
        const resultBox = document.getElementById("resultBox");
        const keyDisplay = document.getElementById("keyDisplay");

        btnGetKey.disabled = true;
        btnGetKey.innerText = "Đang tạo Key...";

        const callbackName = "cb_getkey_" + Date.now();
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);

            btnGetKey.disabled = false;
            btnGetKey.innerText = "LẤY KEY NGAY";

            if (data.success) {
                keyDisplay.innerText = data.key;
                resultBox.style.display = "block";
            } else {
                alert("Lỗi tạo Key: " + (data.message || "Không xác định"));
            }
        };

        const script = document.createElement("script");
        script.src = WEB_APP_URL + "?action=createKey&callback=" + callbackName;
        script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            btnGetKey.disabled = false;
            btnGetKey.innerText = "LẤY KEY NGAY";
            alert("Lỗi kết nối Server!");
        };
        document.body.appendChild(script);
    }

    function copyKey() {
        const keyText = document.getElementById("keyDisplay").innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert("Đã sao chép Key: " + keyText);
        });
    }
</script>

</body>
</html>
