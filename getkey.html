<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LẤY KEY BẢN QUYỀN</title>
  <!-- Thư viện FingerprintJS để nhận diện thiết bị -->
  <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 25px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #22c55e;
      color: #000000;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    h2 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      color: #aaaaaa;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background-color: #262626;
      border: 1px solid #444;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #22c55e;
    }
    .key-box {
      background-color: #262626;
      border: 2px dashed #666666;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffffff;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      background-color: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 12px;
      display: block;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #e6e6e6;
    }
    .btn-link4m {
      background-color: #eab308;
      color: #000000;
    }
    .btn-link4m:hover {
      background-color: #ca8a04;
    }
    .btn-back {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #aaaaaa;
      text-decoration: none;
      border: 1px solid #444444;
      box-sizing: border-box;
      margin-top: 15px;
    }
    .btn-back:hover {
      color: #ffffff;
      border-color: #ffffff;
      background-color: #222;
    }
    .video-box {
      margin: 15px 0 5px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    video {
      width: 100%;
      display: block;
    }
    #msg {
      margin-top: 15px;
      font-size: 14px;
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">✨ Vượt Link Lấy Key</span>
    <h2>LẤY KEY BẢN QUYỀN</h2>

    <!-- Ô NHẬP UID GAME -->
    <div class="input-group">
      <label for="uidInput">Nhập ID Game (UID FF):</label>
      <input type="number" id="uidInput" placeholder="Ví dụ: 123456789">
    </div>

    <!-- NÚT YÊU CẦU LẤY KEY -->
    <button class="btn" id="getKeyBtn" onclick="requestKey()">LẤY MÃ KEY</button>

    <!-- Ô HIỂN THỊ KEY -->
    <div class="key-box" id="keyDisplay">CHƯA LẤY</div>

    <!-- NÚT DẪN SANG LINK4M -->
    <a href="https://link4m.net/NThHxnn" class="btn btn-link4m" id="link4mBtn">⚡ Bấm Vào Đây Để Vượt Link Lấy Key</a>

    <!-- NÚT SAO CHÉP KEY -->
    <button class="btn" onclick="copyKey()">SAO CHÉP KEY</button>

    <!-- VIDEO HƯỚNG DẪN -->
    <p style="font-size: 13px; color: #aaaaaa; text-align: left; margin-top: 20px;">🎬 Video hướng dẫn vượt link:</p>
    <div class="video-box">
      <video controls>
        <source src="lv_0_20261020044711.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ xem video.
      </video>
    </div>

    <a href="index.html" class="btn-back">← Quay lại trang chủ dán Key</a>

    <div id="msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";
    let currentKey = "";
    let cachedDeviceId = "UNKNOWN_DEVICE";

    // Đọc token từ URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    // Khởi tạo lấy Device ID ngầm ngay khi vào trang
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        cachedDeviceId = result.visitorId;
      } catch (err) {
        console.error("Lỗi lấy Device ID:", err);
      }
    });

    // Hàm gọi khi người dùng bấm nút Lấy Mã Key
    async function requestKey() {
      const uid = document.getElementById("uidInput").value.trim();
      const msgDiv = document.getElementById("msg");
      const keyBox = document.getElementById("keyDisplay");

      if (!uid) {
        alert("Vui lòng nhập UID Free Fire của bạn!");
        return;
      }

      keyBox.innerText = "ĐANG TẢI...";
      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang xử lý yêu cầu...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            token: token,
            uid: uid,
            deviceId: cachedDeviceId
          })
        });

        const data = await response.json();

        if (data.status === "success") {
          currentKey = data.key;
          keyBox.innerText = data.key;
          msgDiv.style.color = "#4ade80";
          msgDiv.innerText = "✅ Lấy Key thành công! Hãy bấm Sao chép Key.";
        } else {
          keyBox.innerText = "LỖI";
          msgDiv.style.color = "#f87171";
          msgDiv.innerText = data.message || "Có lỗi xảy ra!";
        }
      } catch (err) {
        keyBox.innerText = "LỖI KẾT NỐI";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Không thể kết nối đến Server!";
      }
    }

    function copyKey() {
      if (!currentKey) {
        alert("Chưa có Key để sao chép!");
        return;
      }
      navigator.clipboard.writeText(currentKey).then(() => {
        alert("Đã sao chép Mã Key vào bộ nhớ tạm!");
      });
    }
  </script>
</body>
</html>
