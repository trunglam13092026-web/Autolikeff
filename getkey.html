<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LẤY KEY XÁC MINH - TLZ PROJECT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 40px 15px; margin: 0; }
        .container { max-width: 420px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #fff; margin-bottom: 10px; font-size: 22px; }
        .dev { font-size: 13px; color: #00ff88; margin-bottom: 20px; }
        .key-box { background: #2a2a2a; border: 2px dashed #00ff88; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; color: #00ff88; word-break: break-all; margin: 20px 0; letter-spacing: 1px; }
        .btn-action { background: #ffc107; color: #000; border: none; padding: 14px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 15px; display: block; text-decoration: none; box-sizing: border-box; }
        .btn-action:hover { background: #e0a800; }
        .btn-copy { background: #007bff; color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .btn-copy:hover { background: #0056b3; }
        .btn-back { display: block; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 14px; }
        .btn-back:hover { color: #fff; text-decoration: underline; }
        #statusMsg { font-size: 13px; color: #ffd700; margin-top: 10px; }
        .hidden { display: none; }
        .step-desc { font-size: 14px; color: #ddd; margin-bottom: 20px; line-height: 1.5; text-align: left; background: #2a2a2a; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>HỆ THỐNG LẤY KEY</h2>
        <div class="dev">TLZ Project Security</div>

        <!-- Bước 1: Yêu cầu vượt link rút gọn -->
        <div id="stepGetLink">
            <div class="step-desc">
                <b>📌 Hướng dẫn lấy Key:</b><br>
                1. Nhấn nút bên dưới để đi đến trang vượt link.<br>
                2. Hoàn thành vượt link Link4M.<br>
                3. Quay lại đây để nhận Key miễn phí!
            </div>
            <!-- Đã gắn link rút gọn Link4M của bạn vào đây -->
            <a href="https://link4m.net/0aFFT" target="_blank" class="btn-action" onclick="unlockKey()">🔗 Vượt Link Lấy Key Ngay</a>
        </div>

        <!-- Bước 2: Hiển thị Key sau khi đã bấm vượt link -->
        <div id="stepShowKey" class="hidden">
            <div class="key-box" id="keyDisplay">Đang tạo Key...</div>
            <button class="btn-copy" onclick="copyKey()">📋 Sao chép Key</button>
            <div id="statusMsg"></div>
        </div>

        <a href="index.html" class="btn-back">⬅ Quay lại trang chủ Buff Like</a>
    </div>

    <script>
        const SECRET_KEY = "TLZ_PROJECT_SECRET_2026";

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }

        function generateKey() {
            const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
            const expireTime = new Date().getTime() + (10 * 60 * 1000); // Hạn 10 phút
            const hexExpire = expireTime.toString(36);

            const rawData = expireTime + "_" + randomPart;
            const sig = simpleHash(rawData + SECRET_KEY).toUpperCase().slice(0, 4);

            return `TLZ-${randomPart}-${sig}-${hexExpire}`;
        }

        // Khi người dùng bấm vào nút vượt link, lưu trạng thái vào trình duyệt
        function unlockKey() {
            localStorage.setItem('tlz_unlocked', 'true');
            setTimeout(() => {
                showKeySection();
            }, 1000);
        }

        function showKeySection() {
            document.getElementById('stepGetLink').classList.add('hidden');
            document.getElementById('stepShowKey').classList.remove('hidden');

            let savedData = localStorage.getItem('active_tlz_key_data');
            let now = new Date().getTime();
            let currentKey = "";

            if (savedData) {
                try {
                    let parsed = JSON.parse(savedData);
                    if (parsed.expireTime > now) {
                        currentKey = parsed.key;
                    }
                } catch (e) {}
            }

            if (!currentKey) {
                currentKey = generateKey();
                let expireTime = now + (10 * 60 * 1000);
                localStorage.setItem('active_tlz_key_data', JSON.stringify({ key: currentKey, expireTime: expireTime }));
            }

            document.getElementById("keyDisplay").innerText = currentKey;
        }

        // Kiểm tra xem người dùng đã bấm vượt link trước đó chưa
        window.addEventListener('DOMContentLoaded', () => {
            const isUnlocked = localStorage.getItem('tlz_unlocked');
            if (isUnlocked === 'true') {
                showKeySection();
            }
        });

        function copyKey() {
            const currentKey = document.getElementById("keyDisplay").innerText;
            navigator.clipboard.writeText(currentKey).then(() => {
                document.getElementById("statusMsg").innerText = "✅ Đã sao chép Key thành công!";
                setTimeout(() => { document.getElementById("statusMsg").innerText = ""; }, 3000);
            }).catch(err => {
                document.getElementById("statusMsg").innerText = "❌ Không thể tự động sao chép!";
            });
        }
    </script>
</body>
</html>
