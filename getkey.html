<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Bản Quyền - BuffLikeFF.site</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px 20px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 100%; max-width: 420px; text-align: center; border: 1px solid #333; }
        
        .badge { background: #065f46; color: #34d399; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 15px; }
        h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; }

        .key-box { background: #2a2a2a; border: 2px dashed #0ea5e9; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .key-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        #key-display { font-size: 20px; font-weight: bold; color: #38bdf8; word-break: break-all; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .btn-link { background: #eab308; color: #121212; margin-bottom: 15px; }
        .btn-link:hover { background: #ca8a04; }

        .btn-copy { background: #0ea5e9; color: white; margin-bottom: 10px; display: none; }
        .btn-copy:hover { background: #0284c7; }

        .warning-box { background: #451a03; border: 1px solid #f59e0b; color: #fde68a; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; line-height: 1.5; }
        .countdown-text { font-size: 18px; font-weight: bold; color: #ef4444; margin-top: 8px; display: block; }
        
        /* KHUNG PHÁT VIDEO TRỰC TIẾP TỪ GITHUB */
        .video-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #444;
            margin: 10px 0 15px;
            background: #000;
        }
        .video-container video {
            width: 100%;
            height: auto;
            max-height: 350px;
            display: block;
        }
        .video-title { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; text-align: left; font-weight: bold; }

        .back-link { display: inline-block; margin-top: 10px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge" id="page-badge">✨ Vượt Link Lấy Key</div>
        <h2>LẤY KEY BẢN QUYỀN</h2>
        
        <div id="warning-container">
            <div class="warning-box" id="warning-content">
                ⚠️ Bạn chưa hoàn thành vượt link! Vui lòng xem video hướng dẫn bên dưới và bấm nút vượt link để lấy Key.
            </div>

            <!-- HIỂN THỊ VIDEO TRỰC TIẾP TỪ FILE GITHUB -->
            <div class="video-title">🎬 Video hướng dẫn vượt link:</div>
            <div class="video-container">
                <video controls playsinline preload="metadata">
                    <source src="lv_0_20261020044711.mp4" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ phát video.
                </video>
            </div>

            <a href="https://link4m.net/0aFFT" id="btn-link-action" class="btn btn-link">🔗 Bấm Vào Đây Để Vượt Link Lấy Key</a>
        </div>

        <div class="key-box" id="key-container">
            <div class="key-label">Mã Key Của Bạn:</div>
            <div id="key-display">Đang tải key...</div>
        </div>

        <button class="btn-copy" id="btn-copy" onclick="copyKeyAndRedirect()">📋 Sao Chép Key Ngay</button>
        
        <a href="index.html" class="back-link">← Quay lại trang chủ dán Key</a>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

        window.onload = async function() {
            let userIp = "";
            try {
                let ipRes = await fetch("https://api.ipify.org?format=json");
                let ipData = await ipRes.json();
                userIp = ipData.ip || "";
            } catch(e){}

            const urlParams = new URLSearchParams(window.location.search);
            const isVerified = urlParams.get("verified");

            if (isVerified === "true") {
                document.getElementById("warning-container").style.display = "none";
                document.getElementById("key-container").style.display = "block";
                document.getElementById("btn-copy").style.display = "block";
                document.getElementById("page-badge").innerText = "✅ Xác Minh Thành Công";

                let keyDisplay = document.getElementById("key-display");

                try {
                    let response = await fetch(WEB_APP_URL + "?v=" + new Date().getTime() + "&ip=" + userIp);
                    let result = await response.json();

                    if (result.status === "locked") {
                        hienDongHoDemNguoc(result.remainingMs);
                        return;
                    }

                    if (result.status === "success") {
                        keyDisplay.innerText = result.key;
                    } else {
                        keyDisplay.innerText = "LỖI TẠO KEY!";
                        keyDisplay.style.color = "#ef4444";
                    }
                } catch (err) {
                    keyDisplay.innerText = "LỖI KẾT NỐI!";
                    keyDisplay.style.color = "#ef4444";
                }
            } else {
                document.getElementById("warning-container").style.display = "block";
                document.getElementById("key-container").style.display = "none";
                document.getElementById("btn-copy").style.display = "none";
            }
        };

        function hienDongHoDemNguoc(remainingMs) {
            document.getElementById("page-badge").innerText = "🔒 Đang Trong Thời Gian Khóa";
            document.getElementById("page-badge").style.background = "#7f1d1d";
            document.getElementById("page-badge").style.color = "#fca5a5";
            
            document.getElementById("key-container").style.display = "none";
            document.getElementById("btn-copy").style.display = "none";

            let warningBox = document.getElementById("warning-content");
            document.getElementById("warning-container").style.display = "block";
            warningBox.style.background = "#451a03";
            warningBox.style.borderColor = "#ef4444";
            
            let endTime = new Date().getTime() + remainingMs;

            let timer = setInterval(function() {
                let currentLeft = endTime - new Date().getTime();
                if (currentLeft <= 0) {
                    clearInterval(timer);
                    location.reload();
                    return;
                }
                let minutes = Math.floor((currentLeft % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((currentLeft % (1000 * 60)) / 1000);

                warningBox.innerHTML = `
                    ⏳ Bạn đang trong thời gian chờ 20 phút:
                    <span class="countdown-text">⏱️ ${minutes} Phút ${seconds} Giây</span>
                `;
            }, 1000);
        }

        function copyKeyAndRedirect() {
            let keyText = document.getElementById("key-display").innerText;
            if(keyText && keyText !== "Đang tải key..." && keyText !== "LỖI TẠO KEY!" && keyText !== "LỖI KẾT NỐI!") {
                navigator.clipboard.writeText(keyText).then(function() {
                    alert("✅ Đã sao chép Key: " + keyText + "\n\nĐang tự động chuyển bạn về trang chủ để nhập Key...");
                    window.location.href = "index.html";
                }).catch(function() {
                    alert("Đã chọn Key: " + keyText);
                    window.location.href = "index.html";
                });
            } else {
                alert("Chưa có Key hợp lệ để sao chép!");
            }
        }
    </script>
</body>
</html>
