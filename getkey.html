<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Bản Quyền - BuffLikeFF.site</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 100%; max-width: 420px; text-align: center; border: 1px solid #333; }
        
        .badge { background: #065f46; color: #34d399; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 15px; }
        h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

        .key-box { background: #2a2a2a; border: 2px dashed #0ea5e9; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .key-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        #key-display { font-size: 20px; font-weight: bold; color: #38bdf8; word-break: break-all; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .btn-link { background: #eab308; color: #121212; margin-bottom: 10px; }
        .btn-link:hover { background: #ca8a04; }
        .btn-copy { background: #0ea5e9; color: white; margin-bottom: 10px; display: none; }
        .btn-copy:hover { background: #0284c7; }

        .warning-box { background: #451a03; border: 1px solid #f59e0b; color: #fde68a; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
        
        .back-link { display: inline-block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge" id="page-badge">✨ Vượt Link Lấy Key</div>
        <h2>LẤY KEY BẢN QUYỀN</h2>
        
        <div id="warning-container">
            <div class="warning-box">
                ⚠️ Bạn chưa hoàn thành vượt link! Vui lòng bấm vào nút bên dưới để vượt link rút gọn lấy Key.
            </div>
            <!-- Đổi link Link4M của Lâm ở đây -->
            <a href="https://link4m.net/0aFFT" onclick="daBamVuotLink()" class="btn btn-link">🔗 Bấm Vào Đây Để Vượt Link Lấy Key</a>
        </div>

        <div class="key-box" id="key-container">
            <div class="key-label">Mã Key Của Bạn:</div>
            <div id="key-display">Đang tải key...</div>
        </div>

        <button class="btn btn-copy" id="btn-copy" onclick="copyKey()">📋 Sao Chép Key Ngay</button>
        
        <a href="index.html" class="back-link">← Quay lại trang chủ dán Key</a>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

        function daBamVuotLink() {
            localStorage.setItem("user_clicked_link", "true");
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const isVerified = urlParams.get("verified");
            const hasClicked = localStorage.getItem("user_clicked_link");

            if (isVerified === "true" || hasClicked === "true") {
                document.getElementById("warning-container").style.display = "none";
                document.getElementById("key-container").style.display = "block";
                document.getElementById("btn-copy").style.display = "block";
                document.getElementById("page-badge").innerText = "✅ Xác Minh Thành Công";

                let keyDisplay = document.getElementById("key-display");
                try {
                    // Ép trình duyệt gọi dữ liệu mới bằng cache: 'no-store' và timestamp
                    let response = await fetch(WEB_APP_URL + "?nocache=" + new Date().getTime(), {
                        cache: 'no-store'
                    });
                    let result = await response.json();

                    if (result.status === "success") {
                        keyDisplay.innerText = result.key;
                        localStorage.removeItem("user_clicked_link");
                    } else {
                        keyDisplay.innerText = "LỖI TẠO KEY!";
                        keyDisplay.style.color = "#ef4444";
                    }
                } catch (err) {
                    keyDisplay.innerText = "LỖI KẾT NỐI!";
                    keyDisplay.style.color = "#ef4444";
                }
            } else {
                document.getElementById("warning-container").style.display = "block";
                document.getElementById("key-container").style.display = "none";
                document.getElementById("btn-copy").style.display = "none";
            }
        };

        function copyKey() {
            let keyText = document.getElementById("key-display").innerText;
            if(keyText && keyText !== "Đang tải key..." && keyText !== "LỖI TẠO KEY!" && keyText !== "LỖI KẾT NỐI!") {
                navigator.clipboard.writeText(keyText);
                alert("Đã sao chép Key: " + keyText);
            } else {
                alert("Chưa có Key hợp lệ để sao chép!");
            }
        }
    </script>
</body>
</html>
