    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

        function getTodayString() {
            const d = new Date();
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isBypassed = urlParams.get('bypassed');
            const savedUnlockDate = localStorage.getItem('tlz_unlock_date');
            const savedKey = localStorage.getItem('active_tlz_key');
            const today = getTodayString();

            // Nếu trong ngày hôm nay đã có Key lưu sẵn -> Giữ nguyên hiển thị Key đó, không đổi
            if (savedUnlockDate === today && savedKey) {
                showKeySection(savedKey);
                cleanUrl(); // Xóa sạch ?bypassed=true trên thanh địa chỉ để chống lỗi khi F5
            } 
            else if (isBypassed === 'true') {
                // Vừa vượt Link4M về -> Mở khung Captcha
                document.getElementById('stepGetLink').classList.add('hidden');
                document.getElementById('stepCaptcha').classList.remove('hidden');
            } 
            else {
                // Truy cập thẳng mà chưa vượt link -> Bắt buộc hiện nút vượt link
                document.getElementById('stepGetLink').classList.remove('hidden');
                document.getElementById('stepCaptcha').classList.add('hidden');
                document.getElementById('stepShowKey').classList.add('hidden');
            }
        });

        // Xóa tham số trên URL để khi người dùng ấn F5 không bị lặp lại luồng
        function cleanUrl() {
            if (window.history.replaceState) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({path: cleanUrl}, '', cleanUrl);
            }
        }

        // Khi giải xong Captcha mới gọi Server lấy Key lần đầu tiên trong ngày
        async function onCaptchaSuccess(token) {
            document.getElementById('stepGetLink').classList.add('hidden');
            document.getElementById('stepCaptcha').classList.add('hidden');
            document.getElementById('stepShowKey').classList.remove('hidden');

            // Kiểm tra xem trong ngày đã xin key lần nào chưa, nếu có rồi thì dùng lại luôn
            const savedUnlockDate = localStorage.getItem('tlz_unlock_date');
            const savedKey = localStorage.getItem('active_tlz_key');
            const today = getTodayString();

            if (savedUnlockDate === today && savedKey) {
                showKeySection(savedKey);
                cleanUrl();
                return;
            }

            try {
                const res = await fetch(GAS_API_URL + "?action=get_key");
                const data = await res.json();

                if (data.status === "success") {
                    localStorage.setItem('tlz_unlock_date', today);
                    localStorage.setItem('active_tlz_key', data.key);
                    showKeySection(data.key);
                    cleanUrl();
                } else {
                    document.getElementById("keyDisplay").innerText = "❌ Lỗi tạo Key từ Server!";
                }
            } catch (e) {
                document.getElementById("keyDisplay").innerText = "❌ Không thể kết nối tới Server!";
            }
        }

        function showKeySection(key) {
            document.getElementById('stepGetLink').classList.add('hidden');
            document.getElementById('stepCaptcha').classList.add('hidden');
            document.getElementById('stepShowKey').classList.remove('hidden');
            document.getElementById("keyDisplay").innerText = key;
        }

        function copyKey() {
            const currentKey = document.getElementById("keyDisplay").innerText;
            navigator.clipboard.writeText(currentKey).then(() => {
                document.getElementById("statusMsg").innerText = "✅ Đã sao chép Key thành công!";
                setTimeout(() => { document.getElementById("statusMsg").innerText = ""; }, 3000);
            }).catch(err => {
                document.getElementById("statusMsg").innerText = "❌ Không thể tự động sao chép!";
            });
        }
    </script>
