<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key Free Fire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h2 {
            color: #ff9900;
            margin-bottom: 20px;
        }

        .key-box {
            background-color: #2a2a2a;
            border: 2px dashed #ff9900;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            letter-spacing: 2px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
        }

        .btn {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #e68a00;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>KEY FREE FIRE CỦA BẠN</h2>

    <div id="keyDisplay" class="key-box">
        Đang xử lý...
    </div>

    <button class="btn" onclick="copyKey()">
        Sao chép Key
    </button>

    <div id="status" class="status">
        Đang tải dữ liệu...
    </div>
</div>

<script>
    // Lấy token từ URL
    function getTokenFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("token");
    }

    // Tạo Key dạng TLZ-MAX-XXXXXX
    function generateRandomKey() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let result = "";

        for (let i = 0; i < 6; i++) {
            result += chars.charAt(
                Math.floor(Math.random() * chars.length)
            );
        }

        return `TLZ-MAX-${result}`;
    }

    // Xử lý Key
    function handleKey() {
        const token = getTokenFromURL();

        const keyDisplay =
            document.getElementById("keyDisplay");

        const statusDisplay =
            document.getElementById("status");

        // Không có token
        if (!token) {
            keyDisplay.innerText = "LỖI TOKEN";

            statusDisplay.innerText =
                "Vui lòng vượt link rút gọn để lấy key!";

            return;
        }

        // Tìm Key đã lưu
        const storageKey = `tlz_key_${token}`;

        let savedKey =
            localStorage.getItem(storageKey);

        if (savedKey) {

            keyDisplay.innerText = savedKey;

            statusDisplay.innerText =
                "Key của bạn (Đã lưu thành công)";

        } else {

            // Tạo Key mới
            const newKey = generateRandomKey();

            // Lưu Key theo token
            localStorage.setItem(
                storageKey,
                newKey
            );

            keyDisplay.innerText = newKey;

            statusDisplay.innerText =
                "Tạo key thành công!";
        }
    }

    // Sao chép Key
    function copyKey() {

        const keyText =
            document.getElementById("keyDisplay").innerText;

        if (keyText.startsWith("TLZ-MAX-")) {

            navigator.clipboard.writeText(keyText)
                .then(() => {
                    alert(
                        "Đã sao chép key thành công: " +
                        keyText
                    );
                })
                .catch(() => {
                    alert(
                        "Không thể sao chép tự động!"
                    );
                });

        } else {

            alert(
                "Chưa có key hợp lệ để sao chép!"
            );
        }
    }

    // Chạy khi trang mở
    handleKey();
</script>

</body>
</html>
