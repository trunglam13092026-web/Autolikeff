<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buff Like Free Fire</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    h2 {
      color: #ff9900;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #ccc;
    }
    .get-key-link {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .get-key-link:hover {
      text-decoration: underline;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      background-color: #ff9900;
      color: #000;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #e68a00;
    }
    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }
    #statusMsg {
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>BUFF LIKE FREE FIRE OB55</h2>
    <p style="color: #ff4d4d; font-size: 13px;">⚠️ Mỗi Key chỉ dùng được 1 lần duy nhất!</p>
    
    <div class="input-group">
      <label for="uidInput">ID Nhân Vật (UID):</label>
      <input type="text" id="uidInput" placeholder="Nhập UID Free Fire...">
    </div>

    <div class="input-group">
      <label for="keyInput">Key - Nhận miễn phí: <a href="https://link4m.net/7tBngB" target="_blank" class="get-key-link">Tại đây</a></label>
      <input type="text" id="keyInput" placeholder="Chìa khóa (Key123...)">
    </div>

    <button id="btnSubmit" onclick="startBuff()">Chạy</button>

    <div id="statusMsg"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwc8iESIspD2GMCv39mA0LkFc1hY1T6X79H9IeDz9qTWPDDLxGMDeE1tIo4eaj7lSXD/exec";

    async function startBuff() {
      const uid = document.getElementById("uidInput").value.trim();
      const userKey = document.getElementById("keyInput").value.trim();
      const btn = document.getElementById("btnSubmit");
      const statusMsg = document.getElementById("statusMsg");

      if (!uid) {
        alert("Vui lòng nhập UID Free Fire!");
        return;
      }
      if (!userKey) {
        alert("Vui lòng nhập Key!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Đang kiểm tra Key...";
      statusMsg.innerText = "";

      try {
        // TRUYỀN CẢ KEY VÀ UID SANG GOOGLE APPS SCRIPT
        const response = await fetch(`${WEB_APP_URL}?action=useKey&key=${encodeURIComponent(userKey)}&uid=${encodeURIComponent(uid)}`);
        const data = await response.json();

        if (data.success) {
          localStorage.removeItem("current_user_key");
          statusMsg.style.color = "#28a745";
          statusMsg.innerText = "✅ Key hợp lệ! Đang tiến hành tăng Like...";
          alert("🎉 Buff Like thành công cho UID: " + uid);
        } else {
          statusMsg.style.color = "#dc3545";
          statusMsg.innerText = data.message;
          alert(data.message);
        }
      } catch (error) {
        alert("Lỗi kết nối máy chủ! Vui lòng thử lại.");
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerText = "Chạy";
      }
    }
  </script>

</body>
</html>
