<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buff Like Free Fire</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #cccccc; }
        .key-link { color: #007bff; text-decoration: none; font-weight: bold; }
        #statusMsg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>BUFF LIKE FREE FIRE</h2>
    
    <input type="text" id="uidInput" placeholder="Nhập UID Free Fire">
    <input type="text" id="keyInput" placeholder="Nhập Key sử dụng">
    
    <div>
        <a href="getkey.html" target="_blank" class="key-link">👉 Nhấp vào đây để lấy Key miễn phí</a>
    </div>

    <button id="btnSubmit" onclick="startBuff()">Chạy</button>

    <div id="statusMsg"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzL9yxIq2gU_QiaOmtj1oUrscPp_fzjcYHvHcyw6Ww47SW1Rm9jX7ZM8lp_6i3l7MFz/exec";

    async function startBuff() {
        const uidInput = document.getElementById("uidInput").value.trim();
        const keyInput = document.getElementById("keyInput").value.trim();
        const statusMsg = document.getElementById("statusMsg");
        const btnSubmit = document.getElementById("btnSubmit");

        if (!uidInput || !keyInput) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Vui lòng nhập đầy đủ UID và Key!";
            return;
        }

        btnSubmit.disabled = true;
        statusMsg.style.color = "blue";
        statusMsg.innerText = "Đang kiểm tra Key và gửi lệnh...";

        const callbackName = "cb_" + Date.now();
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            
            btnSubmit.disabled = false;
            if (data.success) {
                statusMsg.style.color = "green";
                statusMsg.innerText = data.message || "Gửi lệnh Buff thành công!";
            } else {
                statusMsg.style.color = "red";
                statusMsg.innerText = data.message || "Key không hợp lệ hoặc đã được sử dụng!";
            }
        };

        const script = document.createElement("script");
        script.src = WEB_APP_URL + "?action=useKey&key=" + encodeURIComponent(keyInput) + "&uid=" + encodeURIComponent(uidInput) + "&callback=" + callbackName;
        script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            btnSubmit.disabled = false;
            statusMsg.style.color = "red";
            statusMsg.innerText = "Lỗi kết nối Server!";
        };
        document.body.appendChild(script);
    }
</script>

</body>
</html>
