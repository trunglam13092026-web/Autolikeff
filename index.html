<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUFF LIKE FREE FIRE - TỐC ĐỘ CAO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 25px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05);
    }
    h2 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #cccccc;
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #444444;
      background-color: #262626;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }
    input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    button, .btn-link {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .btn-submit {
      background-color: #ffffff;
      color: #000000;
      border: none;
    }
    .btn-submit:hover {
      background-color: #e6e6e6;
    }
    .btn-link {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #666666;
      display: block;
    }
    .btn-link:hover {
      background-color: #333333;
      border-color: #ffffff;
    }
    #statusMsg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .msg-success {
      background-color: #1e3a1e;
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .msg-error {
      background-color: #3a1e1e;
      color: #f87171;
      border: 1px solid #ef4444;
    }
    /* Khung lưu ý & liên hệ */
    .notice-box {
      margin-top: 20px;
      background-color: #222222;
      border: 1px dashed #555555;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #cccccc;
      line-height: 1.6;
    }
    .notice-box strong {
      color: #facc15;
    }
    .notice-box a {
      color: #60a5fa;
      text-decoration: none;
    }
    .notice-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>BUFF LIKE FREE FIRE</h2>
    
    <div class="form-group">
      <label for="uid">ID GAME (UID FREE FIRE):</label>
      <input type="text" id="uid" placeholder="Nhập UID (8-11 chữ số)...">
    </div>

    <div class="form-group">
      <label for="key">MÃ KEY BẮT BUỘC:</label>
      <input type="text" id="key" placeholder="Nhập Key đã lấy...">
    </div>

    <div class="btn-group">
      <button class="btn-submit" onclick="submitBuff()">XÁC NHẬN BUFF LIKE</button>
      <a href="getkey.html" class="btn-link">LẤY KEY NGAY (MIỄN PHÍ)</a>
    </div>

    <!-- KHUNG THÔNG BÁO KHI BẤM XÁC NHẬN -->
    <div id="statusMsg"></div>

    <!-- MỤC LƯU Ý & LIÊN HỆ -->
    <div class="notice-box">
      <strong>📌 LƯU Ý QUAN TRỌNG:</strong><br>
      • Thời gian hoạt động: 09:00 - 23:00 hàng ngày.<br>
      • Mỗi UID chỉ được buff tối đa 1 lần/ngày.<br>
      • Hệ thống tự động chặn IP ảo / VPN / Proxy.<br><br>
      <strong>🌐 KÊNH & LIÊN HỆ:</strong><br>
      • Link nhóm: <a href="https://t.me/tlzchat" target="_blank">t.me/tlzchat</a><br>
      • Admin: <a href="https://t.me/tlzproject" target="_blank">t.me/tlzproject</a><br>
      • TikTok: <a href="https://www.tiktok.com/@hvpcutis1tg" target="_blank">@hvpcutis1tg</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

    let userIp = "";

    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { userIp = data.ip; })
      .catch(() => { userIp = "UNKNOWN"; });

    function showMessage(text, isError = false) {
      const msgDiv = document.getElementById("statusMsg");
      msgDiv.innerText = text;
      msgDiv.className = isError ? "msg-error" : "msg-success";
      msgDiv.style.display = "block";
    }

    function submitBuff() {
      const uid = document.getElementById("uid").value.trim();
      const key = document.getElementById("key").value.trim();

      if (!uid || !key) {
        showMessage("Vui lòng nhập đầy đủ UID và Key!", true);
        return;
      }

      showMessage("Đang xử lý dữ liệu, vui lòng chờ...");

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          uid: uid,
          key: key,
          ip: userIp
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          showMessage(data.message, false);
          document.getElementById("uid").value = "";
          document.getElementById("key").value = "";
        } else {
          showMessage(data.message, true);
        }
      })
      .catch(() => {
        showMessage("Lỗi kết nối Server! Vui lòng thử lại.", true);
      });
    }
  </script>
</body>
</html>
