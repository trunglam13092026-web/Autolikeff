<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buff Like Free Fire OB55 Miễn phí</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }
        h2 { font-size: 20px; color: #1a1a1a; margin-top: 0; margin-bottom: 10px; text-align: center; }
        .notice { font-size: 12px; color: #e11d48; text-align: center; margin-bottom: 20px; font-weight: bold; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 15px; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #6366f1; }
        .key-link { font-size: 13px; margin-top: 12px; margin-bottom: 6px; color: #555; }
        .key-link a { color: #4f46e5; text-decoration: none; font-weight: bold; cursor: pointer; }
        .key-link a:hover { text-decoration: underline; }
        .btn-submit {
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #4f46e5; }
        .btn-submit:disabled { background: #a5b4fc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Buff Like Free Fire OB55</h2>
        <div class="notice">⚠️ Mỗi Key chỉ dùng được 1 lần duy nhất!</div>

        <div>
            <label for="uid">UID Free Fire:</label>
            <input type="text" id="uid" placeholder="Nhập UID Free Fire">
        </div>

        <div>
            <div class="key-link">
                Key - Nhận miễn phí: <a onclick="openRandomKeyLink()">Tại đây</a>
            </div>
            <input type="text" id="key" placeholder="Chìa khóa (Key123...)">
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="runApp()">Chạy</button>
    </div>

    <script>
        // Cấu hình JSONBin
        const JSONBIN_BIN_ID = "6ac6c1d2ac6210605a1db90f";
        const JSONBIN_SECRET_KEY = "$2a$10$ET4hpkJ9Q8Vz/5zT5wdmT..K5ZKMWRhC7jVET49g3lk4tfmiMwlbm";
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        // Cấu hình Telegram Bot
        const TELEGRAM_TOKEN = "8920323422:AAEYHaz1sdO3g78yOryFZZMFzPG77FJp4ok";
        const TELEGRAM_CHAT_ID = "7827755950";

        // Cooldown chống click liên tục (60 phút)
        const COOLDOWN_TIME = 60 * 60 * 1000;

        // Danh sách xoay tua các Link Rút Gọn đã cấu hình
        const KEY_SHORT_LINKS = [
            "https://link4m.net/IgVrW7d",
        ];

        function openRandomKeyLink() {
            const randomIndex = Math.floor(Math.random() * KEY_SHORT_LINKS.length);
            window.open(KEY_SHORT_LINKS[randomIndex], '_blank');
        }

        async function runApp() {
            const uidInput = document.getElementById('uid');
            const keyInput = document.getElementById('key');
            const btnSubmit = document.getElementById('btnSubmit');

            // 1. Kiểm tra Cooldown thiết bị
            const lastBuffTime = localStorage.getItem('last_buff_time');
            const currentTime = new Date().getTime();

            if (lastBuffTime && (currentTime - lastBuffTime < COOLDOWN_TIME)) {
                const remainingMinutes = Math.ceil((COOLDOWN_TIME - (currentTime - lastBuffTime)) / (60 * 1000));
                alert(`⏳ Bạn vừa gửi đơn thành công! Vui lòng đợi thêm ${remainingMinutes} phút nữa để tiếp tục.`);
                return;
            }

            const uid = uidInput.value.trim();
            const userKey = keyInput.value.trim().toLowerCase();

            if (!uid) {
                alert("Vui lòng nhập UID Free Fire!");
                uidInput.focus();
                return;
            }
            if (!userKey) {
                alert("Vui lòng nhập Key!");
                keyInput.focus();
                return;
            }

            btnSubmit.innerText = "Đang xác minh Key...";
            btnSubmit.disabled = true;

            try {
                // 2. Lấy danh sách Key từ JSONBin
                const resGet = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_SECRET_KEY }
                });

                if (!resGet.ok) throw new Error("Lỗi kết nối cơ sở dữ liệu Key");

                const dataGet = await resGet.json();
                let keyList = dataGet.record.keys || [];

                // 3. Kiểm tra xem Key người dùng nhập có tồn tại hay không
                const keyIndex = keyList.findIndex(k => k.toLowerCase() === userKey);

                if (keyIndex !== -1) {
                    btnSubmit.innerText = "Đang hủy Key & gửi đơn...";

                    // Xóa Key đã sử dụng khỏi danh sách
                    keyList.splice(keyIndex, 1);

                    // 4. Cập nhật lại danh sách Key mới lên JSONBin
                    const resPut = await fetch(JSONBIN_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_SECRET_KEY
                        },
                        body: JSON.stringify({ keys: keyList })
                    });

                    if (!resPut.ok) throw new Error("Lỗi cập nhật trạng thái Key");

                    // 5. Gửi thông báo đơn hàng sang Telegram Bot
                    const message = `🔔 **ĐƠN BUFF LIKE MỚI!**\n\n🆔 **UID FF:** \`${uid}\`\n🔑 **Key đã dùng:** \`${keyInput.value.trim()}\`\n📊 **Key còn lại:** ${keyList.length}\n⏰ **Lúc:** ${new Date().toLocaleString('vi-VN')}`;

                    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });

                    // Lưu mốc thời gian đã gửi thành công
                    localStorage.setItem('last_buff_time', new Date().getTime());

                    alert("✅ Xác minh Key thành công! Like sẽ được gửi tới tài khoản trong 5-10 phút.");
                    uidInput.value = '';
                    keyInput.value = '';

                } else {
                    alert("❌ Key không chính xác hoặc đã được sử dụng trước đó!");
                }

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Đã xảy ra lỗi hệ thống! Vui lòng thử lại sau.");
            } finally {
                btnSubmit.innerText = "Chạy";
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
