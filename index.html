<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buff Like Free Fire OB55</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            text-align: center;
            margin-bottom: 8px;
        }

        .sub-title {
            font-size: 13px;
            color: #e53e3e;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 600;
        }

        label a {
            color: #5a67d8;
            text-decoration: none;
            float: right;
            font-weight: 500;
        }

        label a:hover {
            text-decoration: underline;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input:focus {
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: #5a67d8;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: #4c51bf;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Buff Like Free Fire OB55</div>
        <div class="sub-title">⚠️ Mỗi Key chỉ dùng được 1 lần duy nhất!</div>

        <form id="buffForm" onsubmit="handleBuff(event)">
            <div class="form-group">
                <label for="uid">UID Free Fire:</label>
                <input type="text" id="uid" placeholder="Nhập UID Free Fire" required>
            </div>

            <div class="form-group">
                <label for="key">
                    Key - Nhận miễn phí: 
                    <a href="https://link4m.org/r6Fga1EF" target="_blank">Tại đây</a>
                </label>
                <input type="text" id="key" placeholder="Chìa khóa (Key123...)" required>
            </div>

            <button type="submit" class="btn-submit">Chạy</button>
        </form>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8920323422:AAEYHaz1sdO3g78yOryFZZMFzPG77FJp4ok';
        const TELEGRAM_CHAT_ID = '7827755950';

        async function handleBuff(e) {
            e.preventDefault();
            const uid = document.getElementById('uid').value.trim();
            const key = document.getElementById('key').value.trim();

            if (!uid || !key) {
                alert('Vui lòng nhập đầy đủ UID và Key!');
                return;
            }

            // Lấy IP người dùng
            let userIp = 'Không xác định';
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                userIp = ipData.ip;
            } catch (err) {}

            const timeString = new Date().toLocaleString('vi-VN');

            // Nội dung tin nhắn Telegram khi người dùng bấm CHẠY BUFF
            const message = 
`🚀 <b>CÓ LỆNH BUFF LIKE MỚI!</b>
----------------------------------
🎮 <b>UID FF:</b> <code>${uid}</code>
🗝 <b>Key sử dụng:</b> <code>${key}</code>
🌐 <b>IP:</b> <code>${userIp}</code>
⏰ <b>Thời gian:</b> ${timeString}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                alert('Đã gửi yêu cầu Buff thành công! Vui lòng chờ xử lý.');
                document.getElementById('buffForm').reset();
            } catch (error) {
                alert('Có lỗi xảy ra, vui lòng thử lại!');
            }
        }
    </script>
</body>
</html>
