<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUFF LIKE FREE FIRE - TRANG CHỦ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1a1a1a; border: 1px solid #333333; border-radius: 12px; padding: 25px 20px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05); text-align: center; }
    .badge { display: inline-block; background-color: #22c55e; color: #000000; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
    h2 { color: #ffffff; margin-bottom: 15px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 13px; color: #aaaaaa; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background-color: #262626; color: #fff; font-size: 15px; outline: none; }
    .input-group input:focus { border-color: #22c55e; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; background-color: #22c55e; color: #000000; border: none; cursor: pointer; transition: all 0.3s ease; margin-bottom: 12px; }
    .btn:hover { background-color: #16a34a; }
    .btn-key { background-color: #eab308; color: #000000; }
    .btn-key:hover { background-color: #ca8a04; }
    
    .btn-guide { background-color: #3b82f6; color: #ffffff; margin-top: 5px; }
    .btn-guide:hover { background-color: #2563eb; }

    .notice { background-color: #262626; border-left: 4px solid #eab308; padding: 10px; font-size: 12px; color: #ccc; text-align: left; border-radius: 4px; margin-top: 15px; }
    #statusMsg { margin-top: 15px; font-size: 14px; color: #f87171; word-break: break-all; }

    /* Modal xem Video Popup */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background-color: #1a1a1a; padding: 15px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #444; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; }
    video { width: 100%; border-radius: 8px; margin-top: 25px; }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">🔥 HỆ THỐNG BUFF LIKE</span>
    <h2>FREE FIRE VIP</h2>

    <!-- Ô nhập UID Game -->
    <div class="input-group">
      <label for="uidInput">Nhập ID Game (UID) của bạn:</label>
      <input type="text" id="uidInput" placeholder="Ví dụ: 101177498">
    </div>

    <!-- Nút đi lấy Key -->
    <button class="btn btn-key" onclick="goToGetKey()">🔑 Bấm Vào Đây Để Lấy Key</button>

    <!-- Nút xem Video Hướng Dẫn -->
    <button class="btn btn-guide" onclick="openGuide()">🎬 Bấm Vào Đây Để Xem Cách Lấy Key</button>

    <!-- Ô nhập Key và Xác nhận Buff -->
    <div class="input-group" style="margin-top: 15px;">
      <label for="keyInput">Nhập Mã Key đã lấy:</label>
      <input type="text" id="keyInput" placeholder="Dán mã Key vào đây...">
    </div>

    <button class="btn" onclick="submitBuff()">🚀 Tiến Hành Buff Like</button>

    <div class="notice">
      <b>📌 Lưu ý quan trọng:</b><br>
      - Xem video hướng dẫn nếu bạn chưa biết cách vượt link lấy Key.<br>
      - Mỗi thiết bị / địa chỉ IP chỉ lấy được 1 Key duy nhất trong ngày.<br>
      - Key chỉ có hiệu lực trong ngày và dùng được 1 lần duy nhất.
    </div>

    <div id="statusMsg"></div>
  </div>

  <!-- BẢNG XEM VIDEO POPUP -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGuide()">&times;</span>
      <p style="text-align: left; font-size: 14px; font-weight: bold; color: #3b82f6;">🎬 Video hướng dẫn vượt link:</p>
      <video id="guideVideo" controls>
        <source src="lv_0_20261020044711.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ xem video.
      </video>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

    // Tự động điền UID/Key nếu đã lưu
    window.addEventListener('DOMContentLoaded', () => {
      const savedUid = localStorage.getItem("tiz_current_uid");
      const savedKey = localStorage.getItem("tiz_last_key");
      if (savedUid) document.getElementById("uidInput").value = savedUid;
      if (savedKey) document.getElementById("keyInput").value = savedKey;
    });

    function openGuide() {
      document.getElementById("videoModal").style.display = "flex";
    }

    function closeGuide() {
      const video = document.getElementById("guideVideo");
      video.pause();
      document.getElementById("videoModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("videoModal");
      if (event.target === modal) closeGuide();
    }

    // ⚡ HÀM VƯỢT LINK LẤY KEY (Lưu Token chống mất)
    async function goToGetKey() {
      const uid = document.getElementById("uidInput").value.trim();
      if (!uid) {
        alert("Vui lòng nhập ID Game (UID) của bạn trước khi đi lấy Key!");
        return;
      }
      
      const msgDiv = document.getElementById("statusMsg");
      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang tạo phiên vượt link bảo mật...";

      try {
        const res = await fetch(`${SCRIPT_URL}?action=create_onetime_token&uid=${encodeURIComponent(uid)}`);
        const data = await res.json();

        if (data.status === "success") {
          const uniqueToken = data.token;
          
          // Lưu UID và Token ngầm vào máy để chống việc Link4M làm mất token trên URL
          localStorage.setItem("tiz_current_uid", uid);
          localStorage.setItem("tiz_pending_token", uniqueToken);

          let baseLink = "https://link4m.org/DRDP9J"; // Link4M gốc cho VN
          try {
            const geoRes = await fetch('https://ipapi.co/json/');
            const geoData = await geoRes.json();
            if (geoData && geoData.country_code && geoData.country_code !== 'VN') {
              baseLink = "https://link2m.com/0odue40O"; // Link2M cho quốc tế
            }
          } catch(e) {}

          // Chuyển hướng thẳng sang Link4M
          window.location.href = baseLink;
        } else {
          alert("Lỗi tạo phiên: " + data.message);
          msgDiv.innerText = "";
        }
      } catch (err) {
        alert("Lỗi kết nối đến máy chủ!");
        msgDiv.innerText = "";
      }
    }

    // 🚀 HÀM XÁC MINH VÀ BUFF LIKE
    async function submitBuff() {
      const uid = document.getElementById("uidInput").value.trim();
      const key = document.getElementById("keyInput").value.trim();
      const msgDiv = document.getElementById("statusMsg");

      if (!uid || !key) {
        alert("Vui lòng nhập đầy đủ UID và Mã Key!");
        return;
      }

      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang xác minh mã Key...";

      try {
        const response = await fetch(`${SCRIPT_URL}?action=verify_and_buff&uid=${encodeURIComponent(uid)}&key=${encodeURIComponent(key)}`);
        const data = await response.json();

        if (data.status === "success") {
          msgDiv.style.color = "#4ade80";
          msgDiv.innerText = data.message;
          alert(data.message);
        } else {
          msgDiv.style.color = "#f87171";
          msgDiv.innerText = data.message;
        }
      } catch (err) {
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Không thể kết nối đến Server!";
      }
    }
  </script>
</body>
</html>
