<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buff Like Free Fire</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px 0;
            /* Nền Gradient tím xanh chuẩn theo ảnh */
            background: linear-gradient(135deg, #4A63E7 0%, #6E4BB6 50%, #90479A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Thanh địa chỉ IP ở phía trên */
        .ip-bar {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            color: white;
            font-size: 13px;
            margin-top: 10px;
            margin-bottom: 40px;
            width: 90%;
            max-width: 360px;
            backdrop-filter: blur(5px);
        }

        .ip-bar .home-icon {
            background: rgba(255, 255, 255, 0.3);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .ip-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }

        /* Thẻ trắng chứa Form */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 24px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin: 0 0 20px 0;
            color: #111827;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 500;
        }

        label a {
            color: #5C5CFF;
            text-decoration: underline;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            color: #1F2937;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6366F1;
        }

        input[type="text"]::placeholder {
            color: #9CA3AF;
        }

        /* Nút Chạy */
        .btn-submit {
            width: 100%;
            background-color: #6366F1;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #4F46E5;
        }
    </style>
</head>
<body>

    <!-- Thanh hiển thị phía trên -->
    <div class="ip-bar">
        <div class="home-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <div class="ip-text">402:800:62b2:b66b:c905:2e0:82cb:4cad</div>
    </div>

    <!-- Khung chức năng chính -->
    <div class="card">
        <h2>Người đam mê công cụ giống như Free Fire</h2>
        
        <div class="form-group">
            <label for="uid">UID Free Fire:</label>
            <input type="text" id="uid" placeholder="Nhập UID Free Fire">
        </div>

        <div class="form-group">
            <!-- THAY LINK RÚT GỌN 1 (LINK A) CỦA BẠN VÀO HREF DƯỚI ĐÂY -->
            <label>Key - Nhận miễn phí: <a href="https://link1s.com/linkA" target="_blank">Tại đây</a></label>
            <input type="text" id="key" placeholder="Chìa khóa">
        </div>

        <button class="btn-submit" onclick="runApp()">Chạy</button>
    </div>

    <script>
        // THAY LINK RAW GIST (CHỨA DANH SÁCH 26 KEY) CỦA BẠN VÀO ĐÂY
        const KEY_DATABASE_URL = "https://gist.githubusercontent.com/trunglam13092026-web/.../raw/.../Key.txt";

        async function runApp() {
            const uid = document.getElementById('uid').value.trim();
            const key = document.getElementById('key').value.trim();

            if (!uid) {
                alert('Vui lòng nhập UID Free Fire!');
                return;
            }
            if (!key) {
                alert('Vui lòng nhập Key!');
                return;
            }

            try {
                // Tải danh sách Key từ GitHub Gist về kiểm tra
                const response = await fetch(KEY_DATABASE_URL);
                const textData = await response.text();
                
                // Cắt danh sách thành các dòng
                const validKeys = textData.split('\n').map(k => k.trim());

                if (validKeys.includes(key)) {
                    alert('Thành công! Đang tiến hành xử lý cho UID: ' + uid);
                } else {
                    alert('Key không chính xác hoặc đã hết hạn! Vui lòng bấm "Tại đây" để lấy Key mới.');
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ kiểm tra Key!');
            }
        }
    </script>

</body>
</html>
