<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUFF LIKE FREE FIRE MIỄN PHÍ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1a1a1a; border: 1px solid #333333; border-radius: 12px; padding: 25px 20px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05); text-align: center; }
    h2 { color: #22c55e; margin-bottom: 5px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
    p.sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background-color: #262626; color: #fff; font-size: 15px; outline: none; }
    .input-group input:focus { border-color: #22c55e; }
    .get-key-link { display: inline-block; color: #eab308; font-size: 14px; text-decoration: none; margin-bottom: 15px; font-weight: bold; cursor: pointer; }
    .get-key-link:hover { text-decoration: underline; }
    .btn-submit { width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; background-color: #22c55e; color: #000; border: none; cursor: pointer; transition: all 0.3s ease; }
    .btn-submit:hover { background-color: #16a34a; }
    #statusMsg { margin-top: 15px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <h2>BUFF LIKE FI FAI MIỄN PHÍ</h2>
    <p class="sub">Được phát triển bởi hệ thống @tlzproject</p>

    <div class="input-group">
      <label>ID Game (UID):</label>
      <input type="text" id="uidInput" placeholder="Nhập ID Game của bạn...">
    </div>

    <div class="input-group">
      <label>Mã Key xác minh:</label>
      <input type="text" id="keyInput" placeholder="Nhập Key xác minh...">
    </div>

    <a href="javascript:void(0)" onclick="goToGetKey()" class="get-key-link">👉 Nhấp vào đây để lấy Key miễn phí</a>

    <button class="btn-submit" onclick="submitBuff()">XÁC NHẬN BUFF LIKE</button>

    <div id="statusMsg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyntb5KUaQJdRQFq9532zZhlll8bwLlOWw5o1wUYg96rW6gau4rRZjGJ_UPSZaTK-Hx/exec";

    // Tự động điền UID & Key cũ nếu có
    window.addEventListener('DOMContentLoaded', () => {
      const savedUid = localStorage.getItem("tiz_current_uid");
      const savedKey = localStorage.getItem("tiz_last_key");

      if (savedUid) document.getElementById("uidInput").value = savedUid;
      if (savedKey) document.getElementById("keyInput").value = savedKey;
    });

    function goToGetKey() {
      const uid = document.getElementById("uidInput").value.trim();
      if (!uid) {
        alert("Vui lòng nhập ID Game (UID) của bạn trước khi đi lấy Key!");
        return;
      }
      
      // Lưu UID vào bộ nhớ trình duyệt
      localStorage.setItem("tiz_current_uid", uid);
      
      // CHUYỂN HƯỚNG BẮT BUỘC SANG LINK4M ĐỂ TẠO DOANH THU
      window.location.href = "https://link4m.net/NThHxnn";
    }

    async function submitBuff() {
      const uid = document.getElementById("uidInput").value.trim();
      const key = document.getElementById("keyInput").value.trim();
      const msgDiv = document.getElementById("statusMsg");

      if (!uid || !key) {
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Vui lòng nhập đầy đủ UID và Key!";
        return;
      }

      msgDiv.style.color = "#aaaaaa";
      msgDiv.innerText = "Đang kiểm tra Key và tiến hành Buff...";

      try {
        const targetUrl = `${SCRIPT_URL}?action=verify_and_buff&uid=${encodeURIComponent(uid)}&key=${encodeURIComponent(key)}`;
        const response = await fetch(targetUrl);
        const data = await response.json();

        if (data.status === "success") {
          msgDiv.style.color = "#4ade80";
          msgDiv.innerText = data.message;
          localStorage.removeItem("tiz_last_key");
        } else {
          msgDiv.style.color = "#f87171";
          msgDiv.innerText = data.message;
        }
      } catch (err) {
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Lỗi kết nối đến Server!";
      }
    }
  </script>
</body>
</html>
