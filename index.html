<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buff Like FF OB55 Miễn phí</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }
        h2 { font-size: 20px; color: #1a1a1a; margin-top: 0; margin-bottom: 20px; text-align: center; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 15px; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #6366f1; }
        .key-link { font-size: 13px; margin-top: 12px; margin-bottom: 6px; color: #555; }
        .key-link a { color: #4f46e5; text-decoration: none; font-weight: bold; }
        .key-link a:hover { text-decoration: underline; }
        .btn-submit {
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #4f46e5; }
        .btn-submit:disabled { background: #a5b4fc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Buff Like Free Fire OB55 Miễn phí</h2>

        <div>
            <label for="uid">UID Free Fire:</label>
            <input type="text" id="uid" placeholder="Nhập UID Free Fire">
        </div>

        <div>
            <div class="key-link">
                Key - Nhận miễn phí: <a href="https://linkfree.click/s/keyz1u17yvmuy3x2b1" target="_blank">Tại đây</a>
            </div>
            <input type="text" id="key" placeholder="Chia khóa">
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="runApp()">Chạy</button>
    </div>

    <script>
        // Link Gist Raw MỚI (Đã cập nhật V2)
        const KEY_DATABASE_URL_V2 = "https://gist.githubusercontent.com/trunglam13092026-web/d976fc3659545e6b4a1949c0094ac691/raw/9c852835df26f118efef026dc1c0e80578281a7e/Key.txt";

        // Cấu hình Telegram Bot
        const TELEGRAM_TOKEN = "8920323422:AAEYHaz1sdO3g78yOryFZZMFzPG77FJp4ok";
        const TELEGRAM_CHAT_ID = "7827755950";

        async function runApp() {
            const uidInput = document.getElementById('uid');
            const keyInput = document.getElementById('key');
            const btnSubmit = document.getElementById('btnSubmit');

            const uid = uidInput.value.trim();
            const userKey = keyInput.value.trim().toLowerCase();

            if (!uid) {
                alert("Vui lòng nhập UID Free Fire!");
                uidInput.focus();
                return;
            }
            if (!userKey) {
                alert("Vui lòng nhập Key!");
                keyInput.focus();
                return;
            }

            btnSubmit.innerText = "Đang kiểm tra Key...";
            btnSubmit.disabled = true;

            try {
                // Tải danh sách Key từ Gist Raw mới
                const response = await fetch(KEY_DATABASE_URL_V2 + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error("Lỗi tải danh sách Key");

                const text = await response.text();
                
                const validKeys = text
                    .split('\n')
                    .map(k => k.replace('\r', '').trim().toLowerCase())
                    .filter(k => k.length > 0);

                if (validKeys.includes(userKey)) {
                    btnSubmit.innerText = "Đang gửi đơn...";

                    const message = `🔔 **ĐƠN BUFF LIKE MỚI!**\n\n🆔 **UID FF:** \`${uid}\`\n🔑 **Key:** \`${keyInput.value.trim()}\`\n⏰ **Lúc:** ${new Date().toLocaleString('vi-VN')}`;
                    
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });

                    alert("✅ Đã gửi yêu cầu thành công! Like sẽ được buff trong vòng 5-10 phút.");
                    
                    uidInput.value = '';
                    keyInput.value = '';
                } else {
                    alert("❌ Key không chính xác hoặc đã hết hạn!");
                }

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Đã xảy ra lỗi kết nối. Vui lòng thử lại sau!");
            } finally {
                btnSubmit.innerText = "Chạy";
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
