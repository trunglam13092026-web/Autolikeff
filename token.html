<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XÁC NHẬN LẤY KEY - BUFF LIKE FF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background-color: #111827; border: 1px solid #38bdf8; border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
    h2 { color: #38bdf8; font-size: 18px; margin-bottom: 12px; }
    p { font-size: 13px; color: #9ca3af; margin-bottom: 15px; }
    .key-display { background-color: #1f2937; border: 1px dashed #eab308; padding: 12px; font-size: 16px; font-weight: bold; color: #eab308; border-radius: 8px; margin-bottom: 15px; word-break: break-all; }
    .btn { background: linear-gradient(to right, #38bdf8, #0284c7); color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 13px; }
    .btn:hover { opacity: 0.9; }
    #msg { margin-top: 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 XÁC NHẬN LẤY KEY</h2>
    <p id="subText">Đang xác minh phiên làm việc của bạn...</p>

    <div class="key-display" id="keyBox">ĐANG TẠO KEY...</div>

    <button class="btn" id="copyBtn" onclick="copyAndReturn()" style="display: none;">📋 SAO CHÉP KEY & VỀ TRANG CHỦ</button>
    <div id="msg"></div>
  </div>

  <script>
    // 🔴 THAY ĐƯỜNG DẪN WEB APP CÓ CHỮ /exec Ở CUỐI VÀO ĐÂY 🔴
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZAAe_GNoUsKU8JR25JU8NvBqru14crCr7WVqqDq4SVLfSGyBCG57mMI47OGGtX4td/exec";

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const savedUid = localStorage.getItem("tiz_current_uid");
      const msgDiv = document.getElementById("msg");

      if (!token || !savedUid) {
        document.getElementById("keyBox").innerText = "LỖI PHIÊN!";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Phiên làm việc không hợp lệ hoặc đã hết hạn! Vui lòng quay về trang chủ lấy lại link.";
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "generate_key",
            token: token,
            uid: savedUid
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          const generatedKey = data.key || data.key_code;
          document.getElementById("keyBox").innerText = generatedKey;
          document.getElementById("subText").innerText = "🎉 Chúc mừng! Bạn đã lấy Key thành công:";
          document.getElementById("copyBtn").style.display = "block";
          localStorage.setItem("tiz_last_key", generatedKey);
          msgDiv.style.color = "#4ade80";
          msgDiv.innerText = "Key đã được tạo thành công!";
        } else {
          document.getElementById("keyBox").innerText = "THẤT BẠI!";
          msgDiv.style.color = "#f87171";
          msgDiv.innerText = data.message || "Không thể lấy Key!";
        }
      } catch (err) {
        document.getElementById("keyBox").innerText = "LỖI KẾT NỐI!";
        msgDiv.style.color = "#f87171";
        msgDiv.innerText = "Không thể kết nối Server Apps Script!";
      }
    });

    function copyAndReturn() {
      const keyText = document.getElementById("keyBox").innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        alert("Đã sao chép mã Key: " + keyText);
        window.location.href = "index.html";
      }).catch(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
